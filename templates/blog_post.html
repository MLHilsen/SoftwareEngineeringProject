{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <a href="{{ url_for('blog') }}" style="color:#e8845a;text-decoration:none;font-size:.9rem;">← Back to blog</a>
    <div class="mt-3 mb-4">
      <span class="badge" style="background:#e8845a;border-radius:100px;font-size:.7rem;">Newsletter</span>
      <h1 style="font-family:'Playfair Display',serif;font-size:2.2rem;margin-top:12px;">{{ post.title }}</h1>
      <div class="text-muted small">By <strong>{{ post.author.full_name }}</strong> · {{ post.created_at.strftime('%B %d, %Y') }}</div>
    </div>
    <hr style="border-color:#e0d8cc;">
    <div style="line-height:1.9;font-size:1.05rem;color:#3d3d3d;">{{ post.content | replace('\n', '<br>') | safe }}</div>
  </div>
</div>
{% endblock %}
